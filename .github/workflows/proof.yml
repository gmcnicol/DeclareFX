name: Compiler proof

on:
  push:
    branches: [implement/declarefx-proof]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  proof:
    name: Proof (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; packageManager pin
        with:
          run_install: false
      - name: Record actual environment
        run: |
          mkdir -p proof-evidence/gates
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            node --input-type=module -e "import os from 'node:os'; console.log(JSON.stringify({platform:process.platform,arch:process.arch,release:os.release(),version:os.version(),ImageOS:process.env.ImageOS,ImageVersion:process.env.ImageVersion,RUNNER_OS:process.env.RUNNER_OS,RUNNER_ARCH:process.env.RUNNER_ARCH}, null, 2))"
          } 2>&1 | tee proof-evidence/gates/environment.log
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile 2>&1 | tee proof-evidence/gates/install.log
      - name: Clean ESM build
        run: pnpm build 2>&1 | tee proof-evidence/gates/build.log
      - name: Type check
        run: pnpm check 2>&1 | tee proof-evidence/gates/check.log
      - name: Compiled public-interface tests and complete golden
        run: pnpm test 2>&1 | tee proof-evidence/gates/test.log
      - name: Exact vendor artifact and notices
        run: pnpm verify:vendor 2>&1 | tee proof-evidence/gates/vendor.log
      - name: Clean relocated builds and reproducibility evidence
        run: pnpm evidence 2>&1 | tee proof-evidence/gates/reproducibility.log
      - name: No tracked input changes
        run: git diff --exit-code 2>&1 | tee proof-evidence/gates/worktree.log
      - name: Preserve logs, versions, hashes and generated bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-${{ matrix.platform }}
          path: proof-evidence/
          if-no-files-found: error
          retention-days: 90

  compare:
    name: Cross-platform byte identity
    needs: proof
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: proof-*
          path: downloaded-proof
      - name: Require all three platforms, same revision, inputs, dist and golden
        run: node scripts/compare-evidence.mjs downloaded-proof 2>&1 | tee matrix-comparison.log
      - name: Preserve comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-comparison
          path: matrix-comparison.log
          if-no-files-found: error
          retention-days: 90
